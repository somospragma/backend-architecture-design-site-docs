# Análisis de SonarCloud desde CI (job "Calidad · SonarCloud" de .github/workflows/ci.yml).
# Automatic Analysis debe estar desactivado en SonarCloud: los dos no pueden convivir.
sonar.organization=somospragma-sa
sonar.projectKey=somospragma_backend-architecture-design-site-docs

sonar.sources=src,scripts
sonar.tests=tests
sonar.exclusions=src/styles/tokens.css
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Los mismos archivos que excluye la cobertura de vitest.config.ts: CLIs que corren como checks en CI
# y la configuración de contenido que ejecuta Astro en el build.
sonar.coverage.exclusions=src/content.config.ts,scripts/build-tokens.mjs,scripts/check-contrast.mjs,scripts/check-review-dates.mjs
