# Análisis de SonarCloud desde CI (job "Calidad · SonarCloud" de .github/workflows/ci.yml).
# Automatic Analysis debe estar desactivado en SonarCloud: los dos no pueden convivir.
sonar.organization=somospragma-sa
sonar.projectKey=somospragma_backend-architecture-design-site-docs

sonar.sources=src,scripts
sonar.tests=tests
sonar.exclusions=src/styles/tokens.css
sonar.javascript.lcov.reportPaths=coverage/lcov.info
