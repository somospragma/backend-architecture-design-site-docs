# Publicación en GitHub Pages en tres etapas:
#   1. Validar: CI y seguridad completos (los mismos workflows de cada PR).
#   2. Aprobar: el environment `production-approval` pide aprobación manual.
#   3. Desplegar: el environment `github-pages` publica el sitio construido en la etapa 1.
#
# APAGADO hasta que exista la variable de repositorio DEPLOY_ENABLED=true
# (Settings → Secrets and variables → Actions → Variables). Sin ella, el workflow no hace nada.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: Validar · CI
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  security:
    name: Validar · Seguridad
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/security.yml

  build:
    name: Construir el sitio
    needs: [ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Sin caché a propósito: lo que se publica no debe depender de un caché que otro workflow pudo escribir.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  approve:
    name: Aprobar la publicación
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # Configura este environment con "Required reviewers" en Settings → Environments.
    environment: production-approval
    steps:
      - name: Aprobado
        run: echo "Publicación aprobada por ${GITHUB_TRIGGERING_ACTOR} para ${GITHUB_SHA}."

  deploy:
    name: Desplegar en GitHub Pages
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
