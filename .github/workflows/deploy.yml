# Publicación en GitHub Pages, con las mismas etapas que el pipeline de Azure:
#   1. Calidad y Build (ci.yml) en paralelo con Seguridad (security.yml).
#      El sitio se construye una sola vez, en ci.yml, y ese mismo artefacto es el que se publica.
#   2. Aprobar: el environment `production-approval` pide aprobación manual. No arranca si algo de la etapa 1 falló.
#   3. Desplegar: el environment `github-pages` publica el sitio construido en la etapa 1.
#
# APAGADO hasta que exista la variable de repositorio DEPLOY_ENABLED=true
# (Settings → Secrets and variables → Actions → Variables). Sin ella, el workflow no hace nada.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      publish: true

  security:
    name: Seguridad
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/security.yml

  approve:
    name: Aprobación · Publicar en producción
    needs: [ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # Configura este environment con "Required reviewers" y "Prevent self-review" en Settings → Environments,
    # y deja apagado "Allow administrators to bypass" para que nadie se salte la aprobación.
    environment: production-approval
    steps:
      - name: Aprobado
        run: echo "Publicación aprobada para ${GITHUB_SHA}."

  deploy:
    name: Deploy · GitHub Pages
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
