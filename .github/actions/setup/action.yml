# Prepara pnpm, Node.js y las dependencias. Cada job de los workflows la usa después del checkout.
name: Preparar el entorno
description: Instala pnpm, Node.js 22 y las dependencias con el lockfile congelado.

inputs:
  cache:
    description: Usar el caché de pnpm. El build que se publica lo apaga.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: ${{ inputs.cache }}

    - name: Instalar dependencias
      shell: bash
      run: pnpm install --frozen-lockfile
